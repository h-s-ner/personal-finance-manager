<VirtualHost *:443>
  ServerName ${SERVER_URL}

  ## Vhost docroot
  DocumentRoot "/var/www/public"

  ## Directories, there should at least be a declaration for /var/www/frontend/public

  <Directory "/var/www/public">
    Options Indexes FollowSymlinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php 
    SetEnv APPLICATION_ENV "docker"
  </Directory>

  ## Logging
  ErrorLog "/var/log/apache2/frontend_ssl_error.log"
  ServerSignature Off
  CustomLog "/var/log/apache2/frontend_ssl_access.log" combined

  SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

  ## SSL directives
  SSLEngine on
  SSLCertificateFile "/etc/apache2/ssl/server.crt"
  SSLCertificateKeyFile "/etc/apache2/ssl/server.key"
</VirtualHost>
